  html, body { margin: 0; height: 100%; overflow: hidden; background: #fec; color: #111; }
  body { font-family: "Skating Matador", sans-serif; cursor: default; user-select: none; -webkit-user-select: none; }
  #text { user-select: text; -webkit-user-select: text; cursor: text; }
  #text ::selection, #text::selection { color: #00aaaa; background: transparent; }

  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #text {
    white-space: pre; text-align: center; line-height: .805; letter-spacing: -.05em;
    font-size: 150px;
  }
  #text.ready { transition: transform .3s, font-size .3s; }
  .ph { opacity: .25; }
  .cur { display: inline-block; position: relative; width: 0; height: 0; }
  .cur::after {
    content: ""; position: absolute; left: .03em; top: .025em;
    width: .31em; height: .105em; background: #ff7a00; z-index: -1;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #measure {
    position: absolute; visibility: hidden; left: -99999px; top: 0;
    white-space: pre; line-height: .805; letter-spacing: -.05em; font-size: 150px;
  }

<body>
<div id="stage"><div id="text"></div></div>
<div id="measure"></div>

<script>
(() => {
  const BASE = 150, PAD = 0.05;          // base font px, padding as fraction of the stage
  const textEl = document.getElementById('text');
  const meas = document.getElementById('measure');

  const KEY = 'type-preview-text', VKEY = 'type-preview-view';
  let text = '';
  let caret = 0;      // insertion point, 0..text.length
  let mult = 1;       // wheel multiplier
  let angle = 0;      // degrees, accumulates so rotation never unwinds
  try { text = localStorage.getItem(KEY) || ''; } catch (_) {}
  try {
    const v = JSON.parse(localStorage.getItem(VKEY) || '{}');
    if (isFinite(v.mult)) mult = v.mult;
    if (isFinite(v.angle)) angle = v.angle;
  } catch (_) {}
  caret = text.length;
  // storage is written at most once a second; a pending write is flushed when the page is hidden or closed
  let lastSave = 0, pending = false;
  const flush = () => {
    pending = false; lastSave = performance.now();
    try { localStorage.setItem(KEY, text); localStorage.setItem(VKEY, JSON.stringify({ mult, angle })); } catch (_) {}
  };
  const queueSave = () => {
    if (pending) return;
    pending = true;
    setTimeout(flush, Math.max(0, 1000 - (performance.now() - lastSave)));
  };
  const save = queueSave, saveView = queueSave;
  addEventListener('pagehide', () => { if (pending) flush(); });
  document.addEventListener('visibilitychange', () => { if (pending && document.hidden) flush(); });

  // DOM is: text before caret, zero-width cursor, text after caret (or cursor + placeholder when empty)
  function fill(el) {
    const cur = document.createElement('span');
    cur.className = 'cur';
    if (text === '') {
      const ph = document.createElement('span');
      ph.className = 'ph';
      ph.textContent = 'start typing';
      el.replaceChildren(cur, ph);
    } else {
      el.replaceChildren(document.createTextNode(text.slice(0, caret)), cur, document.createTextNode(text.slice(caret)));
    }
  }

  // rebuild the DOM (only when text/caret change, so zoom/rotate never disturb a selection)
  function setText(sel) {
    getSelection().removeAllRanges();
    fill(textEl);
    fill(meas);
    layout();
    if (sel) selectOffsets(sel[0], sel[1]);
  }

  function selectOffsets(a, b) {
    const before = textEl.firstChild, after = textEl.lastChild;
    const pt = p => p <= caret ? [before, p] : [after, p - caret];
    const rg = document.createRange();
    rg.setStart(...pt(a));
    rg.setEnd(...pt(b));
    const s = getSelection(); s.removeAllRanges(); s.addRange(rg);
  }

  function offsetOf(node, off) {
    const pre = document.createRange();
    pre.selectNodeContents(textEl);
    pre.setEnd(node, off);
    return Math.min(text.length, pre.toString().length);
  }

  // selected range as [start, end) offsets into `text`, or null
  function selection() {
    const s = getSelection();
    if (text === '' || !s.rangeCount || s.isCollapsed) return null;
    const rg = s.getRangeAt(0);
    if (!textEl.contains(rg.startContainer) || !textEl.contains(rg.endContainer)) return null;
    const a = offsetOf(rg.startContainer, rg.startOffset);
    const b = Math.min(text.length, a + rg.toString().length);
    return a === b ? null : [a, b];
  }

  function layout() {
    const W = innerWidth, H = innerHeight;
    textEl.style.transform = `rotate(${angle}deg)`;
    const w = meas.offsetWidth || 1, h = meas.offsetHeight || 1;
    const a = angle * Math.PI / 180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
    const bw = w * c + h * s, bh = w * s + h * c;   // bounding box of the rotated text
    const fit = Math.min(1, (W * (1 - 2 * PAD)) / bw, (H * (1 - 2 * PAD)) / bh);
    textEl.style.fontSize = (BASE * fit * mult) + 'px';
  }

  const edit = (a, b, str) => { text = text.slice(0, a) + str + text.slice(b); caret = a + str.length; };

  addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
      e.preventDefault();
      if (text !== '') selectOffsets(0, text.length);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') { e.preventDefault(); copyAll(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;      // (Ctrl-V is left alone so the paste event fires)

    const sel = selection();
    const [a, b] = sel || [caret, caret];
    const ls = caret > 0 ? text.lastIndexOf('\n', caret - 1) + 1 : 0;   // start of caret's line
    const nl = text.indexOf('\n', caret);                              // end of caret's line (or -1)
    const col = caret - ls;
    let edited = true;

    switch (e.key) {
      case 'Enter': edit(a, b, '\n'); break;
      case 'Backspace': if (sel) edit(a, b, ''); else if (caret > 0) edit(caret - 1, caret, ''); break;
      case 'Delete': if (sel) edit(a, b, ''); else if (caret < text.length) edit(caret, caret + 1, ''); break;
      case 'Escape': text = ''; caret = 0; mult = 1; break;
      case 'ArrowLeft': caret = sel ? a : Math.max(0, caret - 1); edited = false; break;
      case 'ArrowRight': caret = sel ? b : Math.min(text.length, caret + 1); edited = false; break;
      case 'Home': caret = ls; edited = false; break;
      case 'End': caret = nl < 0 ? text.length : nl; edited = false; break;
      case 'ArrowUp': {
        if (ls === 0) caret = 0;
        else {
          const pe = ls - 1, ps = pe > 0 ? text.lastIndexOf('\n', pe - 1) + 1 : 0;
          caret = Math.min(ps + col, pe);
        }
        edited = false; break;
      }
      case 'ArrowDown': {
        if (nl < 0) caret = text.length;
        else {
          const ns = nl + 1, ne = text.indexOf('\n', ns);
          caret = Math.min(ns + col, ne < 0 ? text.length : ne);
        }
        edited = false; break;
      }
      default:
        if (e.key.length !== 1) return;
        edit(a, b, e.key);
    }
    e.preventDefault();
    if (edited) { save(); saveView(); }
    setText();
  });

  function copyAll() {
    if (text === '') return;
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallback);
    else fallback();
  }

  addEventListener('paste', e => {
    e.preventDefault();
    const s = ((e.clipboardData && e.clipboardData.getData('text')) || '')
      .replace(/\r\n?/g, '\n').replace(/[\u0000-\u0009\u000b-\u001f\u007f]/g, '');
    if (!s) return;
    const sel = selection();
    const [a, b] = sel || [caret, caret];
    edit(a, b, s);
    save(); saveView();
    setText();
  });

  // mouse: a click places the caret, a drag / double-click selects (caret goes to the selection's end)
  addEventListener('mouseup', () => {
    const s = getSelection();
    if (text === '' || !s.rangeCount) return;
    const rg = s.getRangeAt(0);
    if (!textEl.contains(rg.startContainer)) return;
    const sel = selection();
    if (sel) { caret = sel[1]; setText(sel); }
    else { caret = offsetOf(rg.startContainer, rg.startOffset); setText(); }
  });

  const recent = [];
  let raf = 0;
  const scheduleLayout = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; layout(); }); };
  addEventListener('wheel', e => {
    e.preventDefault();
    let d = e.deltaY || e.deltaX;              // shift+wheel may arrive as deltaX
    if (e.deltaMode === 1) d *= 33;
    if (e.shiftKey) {
      // speed-sensitive: sum of scroll units in the last 150ms.
      // old gain = clamp(sum/100, 1..10). Slow scrolling (sum <= 100, a lone notch) is 8x finer; the fine factor
      // ramps back to 1 by sum = 250, so fast scrolling is exactly as fast as before.
      const now = performance.now();
      recent.push([now, Math.abs(d)]);
      while (recent.length && now - recent[0][0] > 150) recent.shift();
      const sum = recent.reduce((s, r) => s + r[1], 0);
      const x = Math.min(1, Math.max(0, (sum - 100) / 150));
      const fine = 1 / 8 + (7 / 8) * x * x * (3 - 2 * x);
      const gain = Math.min(10, Math.max(1, sum / 100)) * fine;
      angle += d * 0.05 * gain;
    } else {
      mult = Math.min(20, Math.max(0.05, mult * Math.exp(-d * 0.001)));
    }
    saveView();
    scheduleLayout();
  }, { passive: false });

  addEventListener('resize', layout);
  // transitions only switch on after the first fitted layout, so a restored angle/size doesn't animate in
  document.fonts.load(`${BASE}px "Skating Matador"`).then(() => {
    setText();
    requestAnimationFrame(() => requestAnimationFrame(() => textEl.classList.add('ready')));
  });
  setText();
})();
</script>
</body>
</html>
