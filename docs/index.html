:root{--ink:#eee8df;--blood:#6b1b28;--dim:#8a7f78}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font:15px system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 16px}

h1{font:400 34px/1.1 'Matador',Georgia,serif;margin:12px 0 2px;overflow-wrap:anywhere}

.row{display:flex;gap:10px;align-items:center;margin:10px 0}
button{font:inherit;color:var(--ink);background:var(--blood);border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
input[type=range]{flex:1;accent-color:var(--blood);min-width:0}
.t{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
#q{width:100%;font:inherit;background:#120d0f;color:var(--ink);border:1px solid #3a2026;border-radius:6px;padding:9px}
ol{list-style:none;padding:0;margin:8px 0 40px}
li{display:flex;justify-content:space-between;gap:10px;padding:8px 6px;border-bottom:1px solid #1c1416;cursor:pointer}

let base = '', tracks = [], order = [], pos = 0, loaded = null, token = 0, fails = 0;
const cache = new Map();                   // url -> promise of ArrayBuffer
let stream = null;                         // what is feeding the player now

$('#art').src = LOGO;
const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';
const abs = (t, path) => new URL(path, base).href + '?v=' + (t.v || '');
const kindOf = t => t.files.mp3 ? 'mp3' : 'm4a';
const urlsOf = (t, ext) => {
  const f = t.files[ext], dir = `m/${t.id}/`;
  return { init: f.init ? abs(t, `${dir}init.${ext}`) : null,
           parts: f.parts.map((_, i) => abs(t, `${dir}${String(i).padStart(3, '0')}.${ext}`)) };
};

function shuffle(first) {
  order = tracks.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  if (first !== undefined) { order.splice(order.indexOf(first), 1); order.unshift(first); }
  pos = 0;
}

function grab(url) {
  let p = cache.get(url);
  if (!p) {
    p = fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); });
    p.catch(() => cache.delete(url));
  }
  cache.delete(url); cache.set(url, p);        // newest last
  while (cache.size > 12) cache.delete(cache.keys().next().value);
  return p;
}

const updated = sb => new Promise((ok, no) => {
  sb.addEventListener('updateend', ok, { once: true });
  sb.addEventListener('error', () => no(new Error('browser rejected the audio')), { once: true });
});
async function append(s, data) {
  try { s.sb.appendBuffer(data); }
  catch (e) {                                  // buffer full: drop what is behind us
    const to = media.currentTime - 10;
    if (e.name !== 'QuotaExceededError' || to <= 0) throw e;
    s.sb.remove(0, to); await updated(s.sb);
    for (const i of s.have) if (s.starts[i] < to) s.have.delete(i);
    s.sb.appendBuffer(data);
  }
  await updated(s.sb);
}

// keep the 30 s part under the playhead, and the next ~45 s, in the buffer
async function pump() {
  const s = stream;
  if (!s || !s.sb || s.busy) return;
  s.busy = true;
  try {
    for (;;) {
      const t = s.seekTo ?? media.currentTime;
      let i = 0;
      while (i + 1 < s.starts.length && s.starts[i+1] <= t) i++;
      while (i < s.starts.length && s.have.has(i) && s.starts[i] < t + 45) i++;
      if (i >= s.starts.length || s.starts[i] >= t + 45) break;
      const data = await grab(s.urls.parts[i]);
      if (s !== stream) return;
      if (!s.urls.init) { if (s.ms.readyState === 'open') s.sb.abort(); s.sb.timestampOffset = s.starts[i]; }
      await append(s, data);
      if (s !== stream) return;
      s.have.add(i);
    }
    // appending after the end reopens the stream, so close it again or 'ended' never fires
    if (s.have.has(s.starts.length - 1) && s.ms.readyState === 'open') s.ms.endOfStream();
  } catch (e) {
    if (s === stream) fail(e, !media.paused || s.autoplay);
  } finally { s.busy = false; }
}

async function openStream(s, mine) {
  if (window.MediaSource && MediaSource.isTypeSupported(s.mime)) {
    s.ms = new MediaSource();
    media.src = s.src = URL.createObjectURL(s.ms);
    await new Promise(ok => s.ms.addEventListener('sourceopen', ok, { once: true }));
    if (mine !== token) return;
    const sb = s.ms.addSourceBuffer(s.mime);
    s.ms.duration = s.duration;
    if (s.urls.init) { sb.appendBuffer(await grab(s.urls.init)); await updated(sb); }
    s.sb = sb;
  } else {                                     // no streaming support: join all parts
    const all = await Promise.all([s.urls.init, ...s.urls.parts].filter(Boolean).map(grab));
    if (mine !== token) return;
    media.src = s.src = URL.createObjectURL(new Blob(all, { type: s.mime.split(';')[0] }));
  }
}

function show() {
  const t = tracks[order[pos]];
  $('#title').textContent = t.title;
  $('#sub').textContent = [t.artist, t.album, t.genre].filter(Boolean).join(' · ');
  $('#note').textContent = t.comment || '';
  $('#art').src = t.art ? abs(t, t.art) : LOGO;
  document.title = t.title + ' · Skating Matador';
  document.querySelectorAll('li').forEach(li => li.classList.toggle('on', +li.dataset.i === order[pos]));
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title, artist: t.artist, album: t.album || '', artwork: t.art ? [{ src: abs(t, t.art) }] : []
  });
}

function fail(e, autoplay) {
  $('#play').textContent = '▶';
  $('#note').textContent = 'could not load this one: ' + e.message;
  if (autoplay && ++fails < 5) step(1);
}

async function load(autoplay) {
  if (!order.length) return;
  const mine = ++token, t = tracks[order[pos]], ext = kindOf(t), f = t.files[ext];
  media.pause();
  if (stream) URL.revokeObjectURL(stream.src);
  stream = null;
  loaded = null;
  show();
  $('#play').textContent = '…';
  const s = { mime: f.mime, starts: f.parts, urls: urlsOf(t, ext), duration: t.duration, have: new Set(), autoplay };
  try {
    await openStream(s, mine);
    if (mine !== token) return;
    stream = s;
    loaded = t.id;
    await pump();
    if (mine !== token) return;
    $('#play').textContent = '▶';
    if (autoplay) await media.play().catch(() => {});
    const nt = tracks[order[(pos + 1) % order.length]], next = urlsOf(nt, kindOf(nt));
    for (const url of [next.init, next.parts[0]]) if (url) grab(url).catch(() => {});
  } catch (e) {
    if (mine === token) fail(e, autoplay);
  }
}
function step(d) {
  pos += d;
  if (pos >= order.length) shuffle();
  if (pos < 0) pos = order.length - 1;
  load(true);
}
const toggle = () => !loaded ? load(true) : media.paused ? media.play() : media.pause();

function list() {
  const q = $('#q').value.toLowerCase(), ol = $('#list');
  ol.textContent = '';
  tracks.forEach((t, i) => {
    if (q && ![t.title, t.album, t.genre, t.comment].join(' ').toLowerCase().includes(q)) return;
    const li = document.createElement('li'), a = document.createElement('span'), b = document.createElement('span');
    li.dataset.i = i;
    a.textContent = t.title; b.textContent = t.duration ? fmt(t.duration) : ''; b.className = 't';
    li.append(a, b);
    li.classList.toggle('on', i === order[pos]);
    li.onclick = () => { shuffle(i); fails = 0; load(true); scrollTo({ top: 0, behavior: 'smooth' }); };
    ol.append(li);
  });
}

media.onplay = () => { $('#play').textContent = '⏸'; fails = 0; };
media.onpause = () => $('#play').textContent = '▶';
media.onended = () => step(1);
media.onseeking = pump;
media.ontimeupdate = () => {
  pump();
  $('#now').textContent = fmt(media.currentTime);
  $('#len').textContent = fmt(media.duration);
  if (media.duration) $('#seek').value = media.currentTime / media.duration * 1000;
};
$('#seek').oninput = e => { if (media.duration) media.currentTime = e.target.value / 1000 * media.duration; };
$('#vol').oninput = e => { media.volume = e.target.value; try { localStorage.setItem('vol', e.target.value); } catch {} };
try { const v = localStorage.getItem('vol'); if (v !== null) media.volume = $('#vol').value = +v; } catch {}
$('#play').onclick = toggle;
$('#next').onclick = () => { fails = 0; step(1); };
$('#prev').onclick = () => { if (media.currentTime > 3) media.currentTime = 0; else step(-1); };
$('#reshuffle').onclick = () => { shuffle(); load(true); };
$('#q').oninput = list;
addEventListener('keydown', e => {
  if (e.target.id === 'q' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'n') step(1);
  else if (e.key === 'p') step(-1);
  else if (e.target.type !== 'range' && e.key === 'ArrowRight') media.currentTime += 5;
  else if (e.target.type !== 'range' && e.key === 'ArrowLeft') media.currentTime -= 5;
});
if ('mediaSession' in navigator) {
  const on = (a, f) => navigator.mediaSession.setActionHandler(a, f);
  on('play', toggle); on('pause', () => media.pause());
  on('nexttrack', () => step(1)); on('previoustrack', () => step(-1));
}

fetch(TRACKS_URL, { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(j => {
    base = j.base || location.href;
    tracks = (j.tracks || []).filter(t => t.files && Object.keys(t.files).length);
    if (!tracks.length) throw new Error('no tracks in tracks.json');
    shuffle(); show(); list();
  })
  .catch(e => $('#sub').textContent = 'could not read tracks.json: ' + e.message);
</script>
</body></html>
