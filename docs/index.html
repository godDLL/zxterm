:root{--ink:#eee8df;--blood:#6b1b28;--dim:#8a7f78}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font:15px system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
#coverrow{display:flex;gap:8px}
#stage{flex:1;min-width:0;aspect-ratio:1;margin:0 auto;perspective:1000px;cursor:pointer}
#suno{margin-left:auto}
#coverrow #vol{flex:none;width:28px;margin:0;writing-mode:vertical-lr;direction:rtl;touch-action:none}
#art{width:100%;height:100%;object-fit:contain;display:block;opacity:0}
h1{font:400 40px/1.1 'Matador',Georgia,serif;margin:12px 0 2px;overflow-wrap:anywhere}
#sub,#note{color:var(--dim);min-height:1.4em;overflow-wrap:anywhere}
#sub{font:18px 'Matador',Georgia,serif}
#vol{accent-color:#888}
.row{display:flex;gap:8px;align-items:center;margin:10px 0}
button,.btn{font:inherit;color:var(--ink);background:var(--blood);border:0;border-radius:6px;padding:10px 13px;cursor:pointer}
.off{background:#1d1517;color:var(--dim)}
.btn{display:flex;text-decoration:none}.btn[hidden]{display:none}
input[type=range]{flex:1;accent-color:var(--blood);min-width:0}
.t{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
#cats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}#cats button{padding:6px 12px}
#q{width:100%;font:inherit;background:#120d0f;color:var(--ink);border:1px solid #3a2026;border-radius:6px;padding:9px}
ol{list-style:none;padding:0;margin:8px 0 40px}

li.on{background:#2a0d13}li .star{background:none;padding:2px 4px;font-size:18px}li span.t{margin-left:auto}li span:first-of-type{font:22px 'Matador',Georgia,serif;overflow-wrap:anywhere}
@media (min-width:900px){

}

    </div>

    <div class="row"><span class="t" id="now">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="seek"><span class="t" id="len">0:00</span></div>

  </section>
</main>
<script>
const TRACKS_URL = 'tracks.json';          // next to this page on GitHub Pages
const NO_COVER = 'https://goddll.github.io/zxterm/tracks-no_cover.jpg';
const CATS = ['star', 'vocal', 'metal', 'jazz', 'groove', 'chill', 'dance'];   // bit 0 .. bit 6
const $ = s => document.querySelector(s);
const media = new Audio();

let base = '', tracks = [], queue = [], cur = null, loaded = null, token = 0, fails = 0;
let shuffled = false, mask = 0;            // mask 0 = everything
let favs = {};                             // this browser's stars: id -> true/false, over the catalog's
const cache = new Map();                   // url -> promise of ArrayBuffer
let stream = null;                         // what is feeding the player now

const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';
const abs = (t, path) => new URL(path, base).href;
const PART = 40;                            // seconds; the uploader cuts to match
const when = t => Date.parse(t.d) || 0;     // fields: id, t title, a artist, d date, c categories, s seconds, k kind, p parts
const extOf = t => t.k === 'mp3' ? 'mp3' : 'm4a';
const mimeOf = t => ({ mp3: 'audio/mpeg', opus: 'audio/mp4; codecs="opus"', m4a: 'audio/mp4; codecs="mp4a.40.2"' })[t.k];
const urlsOf = t => {
  const ext = extOf(t), dir = `m/${t.id}/`;
  return { init: ext === 'm4a' ? abs(t, `${dir}init.m4a`) : null,
           parts: Array.from({ length: t.p }, (_, i) => abs(t, `${dir}${String(i).padStart(3, '0')}.${ext}`)) };
};

/* ---------- cover ---------- */
const covers = new Map();                  // track id -> promise of a usable image url
function cover(t) {
  if (!covers.has(t.id)) {
    const img = new Image();
    img.src = abs(t, `a/${t.id}.jpg`);
    covers.set(t.id, img.decode().then(() => img.src, () => NO_COVER));
  }
  return covers.get(t.id);
}
let artFor, artTurn = 0;
async function setArt(t) {
  const id = t ? t.id : null;
  if (id === artFor) return;
  const first = artFor === undefined, turn = ++artTurn, el = $('#art');
  artFor = id;
  el.getAnimations().forEach(a => a.cancel());   // or an interrupted flip stays edge-on
  const url = t ? await cover(t) : NO_COVER;
  const ready = new Image(); ready.src = url;
  await ready.decode().catch(() => {});
  if (turn !== artTurn) return;
  if (first || !el.src) {                  // fade from black, zoom into place
    el.src = url; el.style.opacity = 1;
    el.animate([{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 300, easing: 'ease-out' });
    return;
  }
  const half = el.animate([{ transform: 'rotateY(0)' }, { transform: 'rotateY(90deg)' }], { duration: 150, easing: 'ease-in', fill: 'forwards' });
  await half.finished.catch(() => {});
  if (turn !== artTurn) return;
  el.src = url; el.style.opacity = 1;
  half.cancel();
  el.animate([{ transform: 'rotateY(-90deg)' }, { transform: 'rotateY(0)' }], { duration: 150, easing: 'ease-out' });
}

/* ---------- favourites ---------- */
try { favs = JSON.parse(localStorage.getItem('favs')) || {}; } catch {}
const starred = t => favs[t.id] ?? !!(t.c & 1);
// star and instrumental only ever narrow; the others add up (any of the ones that are on)
const matches = t => (!(mask & 1) || starred(t))
  && (!(mask & 2) || !(t.c & 2))
  && (!(mask & ~3) || !!(t.c & mask & ~3));
function toggleStar(t) {
  favs[t.id] = !starred(t);
  try { localStorage.setItem('favs', JSON.stringify(favs)); } catch {}
  queue = queue.filter(matches);           // keeps the current shuffle order
  list();
}

/* ---------- order ---------- */
function rebuild() {                        // newest first, narrowed by category
  queue = tracks.filter(matches);
  if (shuffled) {
    for (let i = queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }
    const i = queue.indexOf(cur);
    if (i > 0) queue.unshift(...queue.splice(i, 1));
  }
  if (!loaded && queue.length) { cur = queue[0]; show(); }
  list();
}

/* ---------- streaming ---------- */
function grab(url) {
  let p = cache.get(url);
  if (!p) {
    p = fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); });
    p.catch(() => cache.delete(url));
  }
  cache.delete(url); cache.set(url, p);        // newest last
  while (cache.size > 24) cache.delete(cache.keys().next().value);
  return p;
}

const updated = sb => new Promise((ok, no) => {
  sb.addEventListener('updateend', ok, { once: true });
  sb.addEventListener('error', () => no(new Error('browser rejected the audio')), { once: true });
});
async function append(s, data) {
  try { s.sb.appendBuffer(data); }
  catch (e) {                                  // buffer full: drop what is behind us
    const to = media.currentTime - 10;
    if (e.name !== 'QuotaExceededError' || to <= 0) throw e;
    s.sb.remove(0, to); await updated(s.sb);
    for (const i of s.have) if (s.starts[i] < to) s.have.delete(i);
    s.sb.appendBuffer(data);
  }
  await updated(s.sb);
}

// keep the 40 s part under the playhead, and the next ~60 s, in the buffer
async function pump() {
  const s = stream;
  if (!s || !s.sb || s.busy) return;
  s.busy = true;
  try {
    for (;;) {
      const t = s.seekTo ?? media.currentTime;
      let i = 0;
      while (i + 1 < s.starts.length && s.starts[i+1] <= t) i++;
      while (i < s.starts.length && s.have.has(i) && s.starts[i] < t + 60) i++;
      if (i >= s.starts.length || s.starts[i] >= t + 60) break;
      const data = await grab(s.urls.parts[i]);
      if (s !== stream) return;
      if (!s.urls.init) { if (s.ms.readyState === 'open') s.sb.abort(); s.sb.timestampOffset = s.starts[i]; }
      await append(s, data);
      if (s !== stream) return;
      s.have.add(i);
    }
    // appending after the end reopens the stream, so close it again or 'ended' never fires
    if (s.have.has(s.starts.length - 1) && s.ms.readyState === 'open') s.ms.endOfStream();
  } catch (e) {
    if (s === stream) fail(e, !media.paused || s.autoplay);
  } finally { s.busy = false; }
}

async function openStream(s, mine) {
  if (window.MediaSource && MediaSource.isTypeSupported(s.mime)) {
    s.ms = new MediaSource();
    media.src = s.src = URL.createObjectURL(s.ms);
    await new Promise(ok => s.ms.addEventListener('sourceopen', ok, { once: true }));
    if (mine !== token) return;
    const sb = s.ms.addSourceBuffer(s.mime);
    s.ms.duration = s.duration;
    if (s.urls.init) { sb.appendBuffer(await grab(s.urls.init)); await updated(sb); }
    s.sb = sb;
  } else {                                     // no streaming support: join all parts
    const all = await Promise.all([s.urls.init, ...s.urls.parts].filter(Boolean).map(grab));
    if (mine !== token) return;
    media.src = s.src = URL.createObjectURL(new Blob(all, { type: s.mime.split(';')[0] }));
  }
}

function show() {
  const t = cur;
  $('#title').textContent = t.t;
  $('#sub').textContent = t.a;
  $('#note').textContent = '';
  setArt(t);
  $('#suno').hidden = false;
  $('#suno').href = 'https://suno.com/song/' + t.id;
  document.title = t.t + ' · ' + t.a;
  document.querySelectorAll('li').forEach(li => li.classList.toggle('on', li.dataset.id === t.id));
  if ('mediaSession' in navigator) cover(t).then(src => {
    if (t === cur) navigator.mediaSession.metadata = new MediaMetadata({ title: t.t, artist: t.a, artwork: [{ src }] });
  });
}

function fail(e, autoplay) {
  $('#play').textContent = '▶';
  $('#note').textContent = 'could not load this one: ' + e.message;
  if (autoplay && ++fails < 5) step(1);
}

async function load(autoplay) {
  if (!cur) return;
  const mine = ++token, t = cur;
  media.pause();
  if (stream) URL.revokeObjectURL(stream.src);
  stream = null;
  loaded = t.id;
  show();
  $('#play').textContent = '…';
  const s = { mime: mimeOf(t), starts: Array.from({ length: t.p }, (_, i) => i * PART), urls: urlsOf(t), duration: t.s, have: new Set(), autoplay };
  try {
    await openStream(s, mine);
    if (mine !== token) return;
    stream = s;
    await pump();
    if (mine !== token) return;
    $('#play').textContent = '▶';
    if (autoplay) await media.play().catch(() => {});
    const nt = queue[(queue.indexOf(t) + 1) % queue.length];
    if (nt) {
      const next = urlsOf(nt);
      for (const url of [next.init, ...(window.MediaSource ? next.parts.slice(0, 1) : next.parts)]) if (url) grab(url).catch(() => {});
      cover(nt);
    }
  } catch (e) {
    if (mine === token) { loaded = null; fail(e, autoplay); }
  }
}
function step(d) {
  if (!queue.length) return;
  const at = queue.indexOf(cur), n = queue.length;
  cur = queue[at < 0 ? (d > 0 ? 0 : n - 1) : (at + d + n) % n];
  load(true);
}
const unlock = () => { if (!media.src) media.load(); };
const toggle = () => !cur ? null : loaded !== cur.id ? (unlock(), load(true)) : media.paused ? media.play() : media.pause();

function list() {
  const q = $('#q').value.toLowerCase(), ol = $('#list');
  ol.textContent = '';
  for (const t of queue) {
    if (q && !t.t.toLowerCase().includes(q)) continue;
    const li = document.createElement('li'), a = document.createElement('span'), b = document.createElement('span');
    li.dataset.id = t.id;
    a.textContent = t.t; b.textContent = t.s ? fmt(t.s) : ''; b.className = 't';
    const star = document.createElement('button');
    star.className = 'star'; star.textContent = starred(t) ? '★' : '☆';
    star.setAttribute('aria-label', 'favourite'); star.setAttribute('aria-pressed', starred(t));
    star.onclick = e => { e.stopPropagation(); toggleStar(t); };
    li.append(star, a, b);
    li.classList.toggle('on', t === cur);
    li.onclick = () => { cur = t; fails = 0; unlock(); load(true); };
    ol.append(li);
  }
}

CATS.forEach((name, bit) => {
  const b = document.createElement('button');
  const [icon, tip] = { star: ['★', 'Favourites'], vocal: ['●', 'Instrumental'] }[name] || [name];
  b.textContent = icon; b.className = 'off';
  if (tip) { b.title = tip; b.setAttribute('aria-label', tip); }
  b.onclick = () => {
    mask ^= 1 << bit;
    b.classList.toggle('off', !(mask & 1 << bit));
    rebuild();
  };
  $('#cats').append(b);
});

media.onplay = () => { $('#play').textContent = '⏸'; fails = 0; };
media.onpause = () => $('#play').textContent = '▶';
media.onended = () => step(1);
media.onseeking = pump;
media.ontimeupdate = () => {
  pump();
  $('#now').textContent = fmt(media.currentTime);
  $('#len').textContent = fmt(media.duration);
  if (media.duration) $('#seek').value = media.currentTime / media.duration * 1000;
};
$('#seek').oninput = e => { if (media.duration) media.currentTime = e.target.value / 1000 * media.duration; };
function setVolume(v) {
  v = Math.round(Math.min(1, Math.max(0, v)) * 100) / 100;
  media.volume = $('#vol').value = v;
  try { localStorage.setItem('vol', v); } catch {}
}
$('#vol').oninput = e => setVolume(+e.target.value);
$('#stage').addEventListener('wheel', e => {  // wheel over the cover: 5% a notch
  e.preventDefault();
  if (e.deltaY) setVolume(media.volume - Math.sign(e.deltaY) * 0.05);
}, { passive: false });
media.volume = 0.67;
try { const v = localStorage.getItem('vol'); if (v !== null) media.volume = $('#vol').value = +v; } catch {}
$('#play').onclick = toggle;
$('#stage').onclick = toggle;

const wide = matchMedia('(min-width:900px)');
// narrow Android: no slider, play at full and let the phone's volume buttons do it
const android = /Android/i.test(navigator.userAgent);
function placeVolume() {
  if (wide.matches) $('#suno').before($('#vol')); else $('#coverrow').append($('#vol'));
  if (!android) return;
  $('#vol').hidden = !wide.matches;
  media.volume = wide.matches ? +$('#vol').value : 1;
}
wide.addEventListener('change', placeVolume);
placeVolume();
// iPhone and iPad ignore volume set by a page, so there is nothing for a slider to do there
const probe = new Audio(); probe.volume = 0.5;
if (probe.volume !== 0.5) $('#vol').hidden = true;

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
$('#next').onclick = () => { fails = 0; step(1); };
$('#prev').onclick = () => { if (media.currentTime > 3) media.currentTime = 0; else step(-1); };
$('#shuffle').onclick = e => {
  shuffled = !shuffled;
  e.target.classList.toggle('off', !shuffled);
  e.target.setAttribute('aria-pressed', shuffled);
  rebuild();
};
$('#q').oninput = list;
addEventListener('keydown', e => {
  if (e.target.id === 'q' || (e.code === 'Space' && e.target.closest('button')) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'n') step(1);
  else if (e.key === 'p') step(-1);
  else if (e.target.type !== 'range' && e.key === 'ArrowRight') media.currentTime += 5;
  else if (e.target.type !== 'range' && e.key === 'ArrowLeft') media.currentTime -= 5;
});
if ('mediaSession' in navigator) {
  const on = (a, f) => navigator.mediaSession.setActionHandler(a, f);
  on('play', toggle); on('pause', () => media.pause());
  on('nexttrack', () => step(1)); on('previoustrack', () => step(-1));
}

fetch(TRACKS_URL, { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(j => {
    base = j.base || location.href;
    tracks = (j.tracks || []).filter(t => t.p).sort((a, b) => when(b) - when(a));
    if (!tracks.length) throw new Error('no tracks in tracks.json');
    rebuild();
  })
  .catch(e => { $('#sub').textContent = 'could not read tracks.json: ' + e.message; setArt(null); });
</script>
</body></html>
